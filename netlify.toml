# Netlify build configuration for the Next.js app.
# Netlify detects Next.js and applies its Next.js runtime automatically,
# serving pages, redirects and server rendering from the build output.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Explicitly load the Netlify Next.js runtime so routes (including the "/"
# redirect) are served by Next.js instead of as raw files from .next.
[[plugins]]
  package = "@netlify/plugin-nextjs"
